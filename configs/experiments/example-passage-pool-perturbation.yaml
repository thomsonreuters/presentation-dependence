id: example-passage-pool-perturbation

reranker:
  class: Qwen3InstructGradeReranker
  model_name: Qwen/Qwen3-4B
  revision: 1cfa9a7208912126459214e8b04321603b3df60c
  model_size: 4b
  model_release: qwen3-og
  chat_template_kwargs: {enable_thinking: false}
  device: auto
  dtype: bfloat16
  scoring_mode: setwise_grade_prompt
  score_output: probability
  continuous_readout: true
  instruction: Given a web search query, retrieve relevant passages that answer the query
  max_length: 4096
  max_doc_chars: 500
  docs_per_score_forward: 20
  batch_size: 20

data:
  dataloader_class: PyseriniLoader
  topics: beir-v1.0.0-arguana-test
  topics_tsv: data/beir-v1.0.0-arguana-test/topics.tsv
  index: beir-v1.0.0-arguana.flat
  run_path: data/beir-v1.0.0-arguana-test/run.bm25.arguana.txt
  k_input: 101

eval:
  qrels_path: data/beir-v1.0.0-arguana-test/qrels.txt
  measures: []

pool_perturbation:
  pool_size: 100
  source_depth: 101
  perturbations: [replace, drop]
  seed: 0
  query_sample_seed: 0
  max_queries: 100
  k_cutoff_for_ndcg: 10

logging: {level: INFO}
