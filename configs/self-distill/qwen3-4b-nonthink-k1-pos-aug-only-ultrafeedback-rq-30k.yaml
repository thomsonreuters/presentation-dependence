###############################################################################
# Permutation augmentation for Qwen3-4B response-quality scoring.
#
# Matched to the K=1-label response SFT recipe except that each epoch trains on
# two independently shuffled B=4 views, both supervised on the same silver
# target. There is no consistency penalty.
###############################################################################

id: qwen3-4b-nonthink-k1-pos-aug-only-ultrafeedback-rq-30k

reranker:
  class: Qwen3InstructGradeReranker
  model_name: Qwen/Qwen3-4B
  model_size: 4b
  model_release: qwen3-og
  chat_template_kwargs:
    enable_thinking: false
  instruction: "Given a user prompt, rate candidate assistant responses by overall quality"
  grade_rubric_id: response_quality_v1
  max_length: 8192
  docs_per_score_forward: 4
  batch_size: 4
  max_doc_chars: 2000

student:
  base_model: Qwen/Qwen3-4B
  reranker_class: Qwen3InstructGradeReranker
  silver_labels_path: silver_labels_ultrafeedback_rq_30k_k1_seed0_qwen3_4b_train.jsonl
  eval_silver_labels_path: silver_labels_ultrafeedback_rq_heldout500_k1_seed0_qwen3_4b.jsonl
  fixture_path: fixture.jsonl
  qrels_path: qrels.txt
  output_dir: runs/self-distill/qwen3-4b-nonthink-k1-pos-aug-only-ultrafeedback-rq-30k/student
  device: cuda
  dtype: bfloat16
  attn_implementation: flash_attention_2
  max_length: 8192
  max_doc_chars: 2000
  instruction: "Given a user prompt, rate candidate assistant responses by overall quality"
  grade_rubric_id: response_quality_v1
  objective:
    type: supervised_mse
    loss: mse
  data:
    chunk_size: 4
    candidate_set_id: ultrafeedback_response_quality_b4
    include_doc_ids_in_prompt: false
    view: regression
    preserve_group_metadata: true
    permutation_augmentation:
      enabled: true
      seeds: [0, 1]
      views_per_epoch: 2
      chunk_sizes: [4]
      shuffle_rate: 1.0
    token_cache:
      enabled: true
      max_entries: 100000
      cache_prefix_strings: true
      cache_token_ids: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  training:
    epochs: 1
    lr: 0.0002
    batch_size_per_device: 1
    grad_accumulation_steps: 8
    slot_forward_batch_size: 4
    gradient_checkpointing: true
    ddp_no_sync_during_grad_accum: true
    warmup_ratio: 0.10
    lr_scheduler: cosine
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.95
    seed: 42
    max_steps: null
    single_forward_readout: true
    log_every_n_steps: 10
    heartbeat_every_s: 60
    progress_jsonl: true
  evaluation:
    max_queries: 100
    every_n_steps: 50
    at_start: true
    at_end: true
    psi:
      enabled: true
      max_queries: 25
      seeds: [0, 1, 2]
  observability:
    tensorboard:
      enabled: true
  checkpoint:
    enabled: true
    save_every_n_steps: 50
    keep_last_n: 4
    keep_every_n_steps: 100
    keep_n_best: 3
    keep_n_best_metric: qrels_ndcg_cut_10
    keep_n_best_mode: max
    resume_from_checkpoint: null

eval:
  measures: [ndcg_cut_10]
  strict_qrels_filter: true

execution:
  fixture_channel: ultrafeedback-response-quality-train
  distributed: ddp

logging:
  level: INFO
