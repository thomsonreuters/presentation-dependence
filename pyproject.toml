[project]
name = "presentation_dependence"
version = "0.1.0"
description = "Order-consistency SFT and evaluation for batched-pointwise LLM rerankers."
readme = "README.md"
# TODO(release): set before publication, once the licence is chosen.
# license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
authors = [
    # TODO(release): author list, pending de-anonymization.
]

dependencies = [
    # IR / eval --------------------------------------------------------------
    "pyserini>=0.43.0",
    "pytrec-eval>=0.5",
    "trectools>=0.0.50",
    "ir-datasets>=0.5.9",
    # Lower bound required: pyserini declares `datasets` unbounded, so uv
    # otherwise resolves 1.1.1, which uses the `pyarrow.PyExtensionType` symbol
    # removed in pyarrow 14.
    "datasets>=2.18.0",
    # Model loading ----------------------------------------------------------
    "torch>=2.2.0",
    # >=5.4 for the Qwen3 model classes and the transformers-v5 `dtype=` API.
    "transformers>=5.4.0,<6",
    "accelerate>=1.3.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.27",
    # Data / utils -----------------------------------------------------------
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
    "pyarrow>=16.1.0",
    "tqdm>=4.67.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.6.1",
    "ftfy>=6.3.1",
]

# Extras are opt-in; see README.md "Installation". `setup.sh --full` installs
# the local-development set.
[project.optional-dependencies]
rerankers = [
    # mxbai-rerank 0.1.6 calls `tokenizer.prepare_for_model`, removed in
    # transformers v5; patched in `rerankers.mxbai_pointwise`.
    "mxbai-rerank>=0.1.0",
    # DeBERTa-v3 tokenizer backend for the vendored PairRM head.
    "sentencepiece>=0.2.0",
]
vllm = [
    # Local parity for the two retained Qwen teacher configs' PyTorch 2.8 stack.
    "vllm==0.10.2",
]
# Dense first stage; the base eval path is Lucene-only and Faiss indexes are large.
dense = [
    "faiss-cpu>=1.8.0",
]
training = [
    "peft>=0.18.0",
    "tensorboard>=2.20.0",
]
# Answer/math verification for the analysis scripts. Stats modules stay
# numpy-only and need no extra, and nothing here plots: the figure scripts are
# not part of this release, so matplotlib is not a dependency of it.
analysis = [
    "math-verify>=0.5",
]
dev = [
    "poethepoet",
    "ipykernel",
    "notebook>=7.3.2",
    "pyright>=1.1.400",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_dependence"]
exclude = ["src/presentation_dependence/**/README.md"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/RELEASE.md"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.poe.tasks]
install-experiment-kernel = "ipython kernel install --name 'presentation_dependence' --user"

lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
# Report-only tasks with a known non-zero baseline; not CI blockers.
lint-debt = "ruff check --statistics --select B,C,D,E,F,W --ignore C901 ."
typecheck = "pyright"

results-check = "python scripts/record_result.py --validate-index"
results-summary = "python scripts/query_results.py"
structural-audit = "python scripts/study.py structural audit"

# Offline end-to-end smoke: synthetic fixture -> rerank -> score.
smoke-build = "python scripts/data/build_smoke_fixture.py"
smoke-run = "python scripts/run_experiment.py -e configs/experiments/_smoke-fixture.yaml"
smoke-score = "python scripts/run_eval.py -e _smoke-fixture"
smoke-assert = "python scripts/check_smoke_result.py"
smoke = ["smoke-build", "smoke-run", "smoke-score", "smoke-assert"]

# What CI runs. Every step must pass on a bare runner: no data, credentials,
# GPU, Java, or warmed HF cache. See the README's development-checks section.
ci = ["lint", "format-check", "smoke", "results-check", "structural-audit"]

# Mirrors the repository-root rule set. It has to be declared here rather than
# inherited: ruff resolves the nearest config.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "W"]
# Tracked debt register: each entry is a category this package does not yet
# satisfy, kept exempt so `ruff check` can block CI on new violations. Burn
# them down and delete codes from this list; `poe lint-debt` reports current
# counts. Anything not listed fails, including undefined names, unused imports,
# mutable default arguments, and new C901 complexity.
ignore = [
    # Missing docstrings on public API: needs human prose.
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    # Docstring layout. Ruff has no fix for D205 and it touches almost every file.
    "D205", "D415",
    # Lines the formatter cannot split (URLs, long literals); ambiguous names.
    "E501", "E741",
    # Imports after module-level `sys.path` setup in `scripts/` entrypoints.
    # Some are load-bearing for container-side flat imports; do not bulk-fix.
    "E402",
    "B007",
    # Whether each zip should be strict=True depends on an invariant only the
    # science owner can confirm, and the autofix silently inserts strict=False.
    "B905", "B904",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# Functions already above the threshold carry an explicit `# noqa: C901`, so the
# rule blocks new complexity. Removing a noqa signals a refactor.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
